[project]
name = "satarkid-ml"
version = "0.1.0"
description = "SatarkID local document and face evidence analysis"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "insightface>=1.0.1",
    "numpy>=2.4.6",
    "onnxruntime>=1.26.0",
    "opencv-python>=4.13.0.92",
    "paddleocr==3.4.1",
    "paddlepaddle==3.3.1",
    "pdf2image>=1.16.0",
    "pillow>=12.2.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.29",
    "uvicorn>=0.47.0",
]
